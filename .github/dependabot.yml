version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # 1.5 moved TSchema and Type to a separate package, so these need a manual
      # migration rather than an automatic bump.
      - dependency-name: '@earendil-works/pi-ai'
      - dependency-name: '@earendil-works/pi-agent-core'
      # Electron major upgrades change the desktop runtime; review them by hand.
      - dependency-name: 'electron'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
