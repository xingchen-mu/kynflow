name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/media/**'
      - 'scripts/build-site.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare static site
        run: node scripts/build-site.mjs
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled; skipping deployment. Enable it in Settings > Pages, then rerun this workflow."
          fi
      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for the Pages artifact to be queryable
        if: steps.pages.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # upload-pages-artifact finishes before its metadata is visible to the
          # deploy step's API call; poll until it shows up to avoid a spurious
          # "No artifacts named github-pages" failure.
          for i in $(seq 1 30); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '.artifacts | map(select(.name == "github-pages")) | length')
            if [ "$count" -gt 0 ]; then
              echo "github-pages artifact is visible (count=$count)"
              exit 0
            fi
            echo "artifact not yet queryable, waiting ($i/30)..."
            sleep 5
          done
          echo "::error::github-pages artifact did not become queryable in time"
          exit 1
      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
